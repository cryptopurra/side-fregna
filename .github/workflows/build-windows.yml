name: Build Windows VST3

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target SideFregna_VST3
      - name: Package plugin
        shell: pwsh
        run: Compress-Archive -Path 'build/SideFregna_artefacts/Release/VST3/Side Fregna.vst3' -DestinationPath 'Side-Fregna-VST3-Windows.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Side-Fregna-VST3-Windows
          path: Side-Fregna-VST3-Windows.zip
          if-no-files-found: error
